<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Playable Cubes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cubeDark: '#0b0d17',
                        cubeCard: '#151928',
                        cubeBorder: '#232b45',
                        neonCyan: '#00f0ff',
                        neonPurple: '#a855f7',
                        neonPink: '#ff007f',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d17;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* 3D Cube Perspective Container */
        .cube-scene {
            perspective: 1000px;
        }

        /* Animated Cubes */
        .cube-box {
            position: relative;
            transform-style: preserve-3d;
            animation: spin 12s infinite linear;
        }

        .cube-box-1 { animation: float 4s ease-in-out infinite, spin 14s infinite linear; }
        .cube-box-2 { animation: float 5s ease-in-out infinite 0.5s, spin 18s infinite reverse linear; }
        .cube-box-3 { animation: float 4.5s ease-in-out infinite 1s, spin 16s infinite linear; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(15deg) rotateY(15deg); }
            50% { transform: translateY(-18px) rotateX(25deg) rotateY(30deg); }
        }

        @keyframes spin {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* Individual Cube Face Styling */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: 2px solid rgba(0, 240, 255, 0.6);
            background: rgba(21, 25, 40, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* Cube Dimensions for size 80px */
        .cube-size-md { width: 80px; height: 80px; }
        .cube-size-md .front  { transform: translateZ(40px); }
        .cube-size-md .back   { transform: rotateY(180deg) translateZ(40px); }
        .cube-size-md .right  { transform: rotateY(90deg) translateZ(40px); }
        .cube-size-md .left   { transform: rotateY(-90deg) translateZ(40px); }
        .cube-size-md .top    { transform: rotateX(90deg) translateZ(40px); }
        .cube-size-md .bottom { transform: rotateX(-90deg) translateZ(40px); }

        /* Cube Dimensions for size 100px */
        .cube-size-lg { width: 100px; height: 100px; }
        .cube-size-lg .front  { transform: translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }
        .cube-size-lg .back   { transform: rotateY(180deg) translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }
        .cube-size-lg .right  { transform: rotateY(90deg) translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }
        .cube-size-lg .left   { transform: rotateY(-90deg) translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }
        .cube-size-lg .top    { transform: rotateX(90deg) translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }
        .cube-size-lg .bottom { transform: rotateX(-90deg) translateZ(50px); border-color: rgba(168, 85, 247, 0.8); }

        .neon-glow {
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between items-center p-6 selection:bg-neonCyan selection:text-cubeDark">

    <header class="w-full max-w-5xl flex items-center justify-between py-4">
        <a href="/" class="flex items-center space-x-3 group">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neonCyan to-neonPurple p-0.5 flex items-center justify-center shadow-lg">
                <div class="w-full h-full bg-cubeDark rounded-[7px] flex items-center justify-center">
                    <i class="fa-solid fa-cube text-neonCyan group-hover:scale-110 transition-transform"></i>
                </div>
            </div>
            <span class="font-bold tracking-wider text-white font-mono text-sm">PLAYABLE<span class="text-neonCyan">CUBES</span></span>
        </a>
    </header>

    <main class="flex flex-col items-center justify-center text-center my-auto py-12 max-w-2xl">
        
        <!-- Three Floating Cubes Display -->
        <div class="cube-scene flex items-center justify-center gap-8 sm:gap-12 mb-12 h-36">
            
            <!-- Cube 1 (Cyan) -->
            <div class="cube-box cube-box-1 cube-size-md">
                <div class="face front"><i class="fa-solid fa-ghost text-neonCyan text-xl"></i></div>
                <div class="face back"><i class="fa-solid fa-cube text-neonCyan text-xl"></i></div>
                <div class="face right"><i class="fa-solid fa-gamepad text-neonCyan text-xl"></i></div>
                <div class="face left"><i class="fa-solid fa-bug text-neonCyan text-xl"></i></div>
                <div class="face top"><i class="fa-solid fa-cube text-neonCyan text-xl"></i></div>
                <div class="face bottom"><i class="fa-solid fa-cube text-neonCyan text-xl"></i></div>
            </div>

            <!-- Cube 2 (Center Purple - Main) -->
            <div class="cube-box cube-box-2 cube-size-lg">
                <div class="face front"><span class="font-mono font-black text-neonPurple text-2xl">404</span></div>
                <div class="face back"><span class="font-mono font-black text-neonPurple text-2xl">404</span></div>
                <div class="face right"><i class="fa-solid fa-cubes text-neonPurple text-2xl"></i></div>
                <div class="face left"><i class="fa-solid fa-cubes text-neonPurple text-2xl"></i></div>
                <div class="face top"><i class="fa-solid fa-bolt text-neonPurple text-xl"></i></div>
                <div class="face bottom"><i class="fa-solid fa-skull text-neonPurple text-xl"></i></div>
            </div>

            <!-- Cube 3 (Pink/Cyan) -->
            <div class="cube-box cube-box-3 cube-size-md">
                <div class="face front"><i class="fa-solid fa-compass text-neonPink text-xl"></i></div>
                <div class="face back"><i class="fa-solid fa-cube text-neonPink text-xl"></i></div>
                <div class="face right"><i class="fa-solid fa-dice-d6 text-neonPink text-xl"></i></div>
                <div class="face left"><i class="fa-solid fa-unlink text-neonPink text-xl"></i></div>
                <div class="face top"><i class="fa-solid fa-cube text-neonPink text-xl"></i></div>
                <div class="face bottom"><i class="fa-solid fa-cube text-neonPink text-xl"></i></div>
            </div>

        </div>

        <!-- Requested Bold H1 Heading -->
        <h1 class="text-5xl sm:text-7xl font-black text-white tracking-tight mb-4 neon-glow uppercase">
            ERROR 404
        </h1>

        <p class="text-slate-400 font-mono text-sm sm:text-base mb-8 max-w-md">
            Lost in the grid? The cube or page you're searching for got rotated out of existence.
        </p>

        <!-- Navigation Call to Action -->
        <div class="flex flex-col sm:flex-row items-center gap-4">
            <a href="/" class="w-full sm:w-auto bg-gradient-to-r from-neonCyan to-teal-400 text-cubeDark font-bold px-8 py-3.5 rounded-xl hover:opacity-90 transition-all shadow-lg flex items-center justify-center space-x-2 font-mono">
                <i class="fa-solid fa-house"></i>
                <span>Return to Arcade</span>
            </a>
            <button onclick="history.back()" class="w-full sm:w-auto bg-cubeCard border border-cubeBorder hover:border-neonPurple text-slate-300 font-medium px-6 py-3.5 rounded-xl transition-all flex items-center justify-center space-x-2 font-mono text-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Go Back</span>
            </button>
        </div>

    </main>

    <footer class="w-full max-w-5xl text-center py-4 text-xs font-mono text-slate-500 border-t border-cubeBorder/40">
        <span>Playable Cubes Studio &bull; Lost Block Index #404</span>
    </footer>

</body>
</html>
